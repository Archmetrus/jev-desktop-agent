[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-desktop-agent"
version = "0.1.0"
description = "Jev decisions with controlled KDE Wayland execution"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
desktop-agent = "desktop_agent.cli:main"

[tool.setuptools.packages.find]
include = ["desktop_agent*"]

[tool.setuptools.package-data]
desktop_agent = ["dom.js"]
